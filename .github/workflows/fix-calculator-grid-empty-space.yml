name: One-time calculator grid empty-space fix

on:
  push:
    branches:
      - fix-calculator-desktop-empty-space

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-calculator-desktop-empty-space
          fetch-depth: 0

      - name: Fix desktop calculator result grid span
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('css/pages/calculator-page-v2.css')
          text = path.read_text(encoding='utf-8')
          old = '    grid-row: 1 / span 30;'
          new = '    grid-row: 1;'
          if old not in text:
              raise SystemExit('Expected grid-row rule not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify targeted change
        run: |
          grep -n "grid-row: 1;" css/pages/calculator-page-v2.css
          ! grep -q "grid-row: 1 / span 30;" css/pages/calculator-page-v2.css

      - name: Run quality checks
        run: |
          npm ci
          npm run quality

      - name: Remove one-time workflow and commit
        run: |
          rm .github/workflows/fix-calculator-grid-empty-space.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add css/pages/calculator-page-v2.css .github/workflows/fix-calculator-grid-empty-space.yml
          git commit -m "Fix desktop calculator empty space"
          git push origin HEAD:fix-calculator-desktop-empty-space
