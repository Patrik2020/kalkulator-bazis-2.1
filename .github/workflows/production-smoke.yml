name: Production smoke

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read
  issues: write

concurrency:
  group: production-smoke
  cancel-in-progress: true

jobs:
  reachability:
    name: Production reachability
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      blocked: ${{ steps.probe.outputs.blocked }}

    steps:
      - name: Probe Cloudflare reachability
        id: probe
        shell: bash
        env:
          KB_MONITOR_TOKEN: ${{ secrets.KB_MONITOR_TOKEN }}
        run: |
          set -euo pipefail

          headers_file="$(mktemp)"
          trap 'rm -f "$headers_file"' EXIT

          monitor_header=()
          if [[ -n "${KB_MONITOR_TOKEN:-}" ]]; then
            monitor_header=(-H "X-KB-Monitor-Token: ${KB_MONITOR_TOKEN}")
          fi

          set +e
          status="$(curl -sS \
            --max-time 15 \
            --connect-timeout 10 \
            -D "$headers_file" \
            -o /dev/null \
            -w '%{http_code}' \
            -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36' \
            -H 'Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8' \
            -H 'Accept-Language: hu-HU,hu;q=0.9,en-US;q=0.7,en;q=0.6' \
            -H 'Cache-Control: no-cache' \
            -H 'Pragma: no-cache' \
            "${monitor_header[@]}" \
            https://kalkulatorbazis.hu/)"
          curl_exit=$?
          set -e

          if [[ $curl_exit -ne 0 ]]; then
            echo "::error title=Production reachability failed::curl exited with code $curl_exit"
            exit "$curl_exit"
          fi

          server="$(awk 'BEGIN{IGNORECASE=1} /^server:/ {gsub("\r", ""); sub(/^[^:]*:[[:space:]]*/, ""); print; exit}' "$headers_file")"
          ray="$(awk 'BEGIN{IGNORECASE=1} /^cf-ray:/ {gsub("\r", ""); sub(/^[^:]*:[[:space:]]*/, ""); print; exit}' "$headers_file")"

          if [[ "$status" == "403" && "${server,,}" == *"cloudflare"* ]]; then
            echo "blocked=true" >> "$GITHUB_OUTPUT"
            echo "::warning title=Production audit inconclusive::Cloudflare blocked the GitHub-hosted runner (HTTP 403${ray:+, cf-ray=$ray}). The live audit is intentionally skipped; this is not treated as a site regression."
            {
              echo "### Production smoke: inconclusive"
              echo
              echo "Cloudflare blocked the GitHub-hosted runner with HTTP 403, so the live production audit could not be executed."
              echo
              echo "- Server: ${server:-unknown}"
              echo "- CF-Ray: ${ray:-unknown}"
              echo "- Result: **audit skipped, not passed and not failed**"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [[ ! "$status" =~ ^[23][0-9][0-9]$ ]]; then
            echo "blocked=false" >> "$GITHUB_OUTPUT"
            echo "::error title=Production reachability failed::Unexpected HTTP $status${server:+ from $server}${ray:+, cf-ray=$ray}"
            exit 1
          fi

          echo "blocked=false" >> "$GITHUB_OUTPUT"
          echo "Production endpoint reachable: HTTP $status${server:+, server=$server}${ray:+, cf-ray=$ray}"

  production:
    name: Production audit
    needs: reachability
    if: needs.reachability.outputs.blocked != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout deployed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"

      - name: Verify live Kalkulátor Bázis
        env:
          KB_PRODUCTION_BASE_URL: https://kalkulatorbazis.hu
          KB_MONITOR_TOKEN: ${{ secrets.KB_MONITOR_TOKEN }}
          KB_PRODUCTION_ATTEMPTS: "8"
          KB_PRODUCTION_RETRY_DELAY_MS: "15000"
          KB_PRODUCTION_REQUEST_TIMEOUT_MS: "15000"
        run: node scripts/production-smoke-audit.js

  verdict:
    name: Production verified status
    # The previous workflow was green even when the real audit was skipped.
    # A verified result now requires BOTH jobs to actually pass.
    if: ${{ always() }}
    needs: [reachability, production]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout status code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Classify actual live-verification coverage
        id: classify
        env:
          KB_REACHABILITY_RESULT: ${{ needs.reachability.result }}
          KB_CLOUDFLARE_BLOCKED: ${{ needs.reachability.outputs.blocked }}
          KB_PRODUCTION_RESULT: ${{ needs.production.result }}
        run: node scripts/production-monitor-verdict.js

      - name: Create or resolve one deduplicated GitHub monitoring incident
        env:
          GH_TOKEN: ${{ github.token }}
          KB_MONITOR_STATE: ${{ steps.classify.outputs.state }}
        run: node scripts/production-monitor-incident.js

      - name: Enforce real verification, never silently pass a skipped audit
        if: ${{ steps.classify.outputs.state != 'verified' }}
        env:
          KB_MONITOR_STATE: ${{ steps.classify.outputs.state }}
        run: |
          echo "::error title=Production not verified::Result ${KB_MONITOR_STATE}: inspect the incident issue for Cloudflare blocking or a real production failure."
          exit 1
