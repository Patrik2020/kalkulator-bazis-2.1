name: Finalize life-situation hubs
on:
  push:
    branches: [life-situation-hubs]
    paths: ['.github/workflows/finalize-life-situation-hubs.yml']
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: life-situation-hubs
      - uses: actions/setup-node@v4
        with:
          node-version: '24.8.0'
          cache: npm
      - run: npm ci
      - name: Generate sitemap
        run: npm run sitemap
      - name: Run quality checks
        run: npm run quality
      - name: Remove one-time workflow and commit
        run: |
          rm .github/workflows/finalize-life-situation-hubs.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml .github/workflows/finalize-life-situation-hubs.yml
          git commit -m "Finalize life-situation hubs" || exit 0
          git push
