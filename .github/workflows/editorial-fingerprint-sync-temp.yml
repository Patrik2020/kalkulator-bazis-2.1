name: Editorial asset fingerprint synchronization (temporary)
on:
  push:
    branches: [content/2026-10-31-five-news-update-markers]
    paths:
      - ".github/workflows/editorial-fingerprint-sync-temp.yml"
      - "index.html"
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Normalize hashes
        run: |
          node scripts/cache-bust-assets.js
          git add -u
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Refresh editorial asset fingerprint'
            git push origin HEAD:content/2026-10-31-five-news-update-markers
          fi
