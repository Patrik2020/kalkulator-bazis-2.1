name: Add ChatGPT plugin announcement

on:
  push:
    branches:
      - feat/chatgpt-plugin-announcement

permissions:
  contents: write

jobs:
  update-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/chatgpt-plugin-announcement

      - name: Add announcement blocks
        shell: python
        run: |
          from pathlib import Path
          from textwrap import dedent

          index = Path("index.html")
          index_text = index.read_text(encoding="utf-8")
          index_anchor = '    <div class="container home-sections">\n      <section class="home-section" aria-labelledby="categoriesTitle">'
          index_insert = dedent("""\
              <div class="container home-sections">
                <section class="learning-highlight" aria-labelledby="chatgptPluginTitle">
                  <div class="learning-mark" aria-hidden="true"></div>
                  <div>
                    <span class="section-label">Újdonság · ChatGPT</span>
                    <h2 id="chatgptPluginTitle">A Kalkulátor Bázis már ChatGPT-bővítményként is elérhető</h2>
                    <p>A 2026-os nettó–bruttó számításokat a saját Kalkulátor Bázis Salary API végzi, így a számítások közvetlenül ChatGPT-ből is használhatók.</p>
                  </div>
                  <a class="highlight-link" href="kalkulatorok/netto-brutto-kalkulator">Nettó–bruttó kalkulátor</a>
                </section>

                <section class="home-section" aria-labelledby="categoriesTitle">""")
          index_insert = "    " + index_insert.replace("\n", "\n    ").rstrip()
          if index_anchor not in index_text:
              raise SystemExit("Homepage insertion anchor not found")
          index.write_text(index_text.replace(index_anchor, index_insert, 1), encoding="utf-8")

          salary = Path("kalkulatorok/netto-brutto-kalkulator.html")
          salary_text = salary.read_text(encoding="utf-8")
          salary_anchor = '      </section>\n\n      <!-- KALKULÁTOR -->'
          salary_insert = dedent("""\
              </section>

              <aside class="notice-box" aria-label="Kalkulátor Bázis ChatGPT-bővítmény">
                <strong>Újdonság: a Kalkulátor Bázis már ChatGPT-bővítményként is elérhető.</strong>
                A 2026-os nettó–bruttó számításokat a saját Kalkulátor Bázis Salary API végzi, így ugyanez a számítás közvetlenül ChatGPT-ből is használható.
              </aside>

              <!-- KALKULÁTOR -->""")
          salary_insert = "      " + salary_insert.replace("\n", "\n      ").rstrip()
          if salary_anchor not in salary_text:
              raise SystemExit("Salary page insertion anchor not found")
          salary.write_text(salary_text.replace(salary_anchor, salary_insert, 1), encoding="utf-8")

      - name: Commit website update and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/add-chatgpt-plugin-announcement.yml
          git add index.html kalkulatorok/netto-brutto-kalkulator.html .github/workflows/add-chatgpt-plugin-announcement.yml
          git commit -m "feat: announce ChatGPT plugin on key pages"
          git push origin HEAD:feat/chatgpt-plugin-announcement
