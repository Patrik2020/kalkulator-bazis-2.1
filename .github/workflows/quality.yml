name: Site quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: site-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install validation dependencies
        run: npm ci

      - name: Validate HTML, JavaScript and calculator logic
        run: npm run quality

      - name: Verify generated sitemap URL set is current
        run: |
          npm run sitemap
          git diff --exit-code -I '<lastmod>.*</lastmod>' -- sitemap.xml
