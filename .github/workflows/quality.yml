name: Site quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: site-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Site quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm

      - name: Install validation dependencies
        run: npm ci

      - name: Test Chrome timeout retry safety
        run: node --test scripts/chrome-render-retry.test.js

      - name: Test browser QA consent gate rejects regressions
        run: node --test scripts/browser-qa-policy-runner.test.js

      - name: Test shared AdSense page policy
        run: node --test scripts/adsense-policy.test.js scripts/publisher-ads.test.js

      - name: Test calculator scope isolation and collision detection
        run: node --test scripts/calculator-scopes.test.js

      - name: Test shared component lifecycle and load recovery
        run: node --test scripts/site-runtime.test.js

      - name: Test content-hash asset versions and dependency propagation
        run: node --test scripts/asset-versions.test.js

      - name: Test the single-pass static build contract
        run: npm run test:build-pipeline

      - name: Verify selectable salary tax-rate wiring
        run: node scripts/salary-rate-selector-audit.js

      - name: Validate responsive viewport contract
        run: node scripts/responsive-contract-audit.js

      - name: Audit crawler-visible source HTML
        run: npm run static:check

      - name: Validate HTML, JavaScript and calculator logic
        run: npm run quality

      - name: Run final calculator inventory gate
        run: node scripts/final-fullsite-audit.js

      - name: Verify sitemap URL coverage
        run: npm run quality:3
