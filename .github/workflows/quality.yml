name: Site quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: site-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Site quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm

      - name: Install validation dependencies
        run: npm ci

      - name: Test release identity and isolated rollback safeguards
        run: node --test scripts/release-identity.test.js scripts/rollback-drill.test.js

      - name: Rehearse release fingerprint and rollback on checked-out source
        env:
          KB_RELEASE_MANIFEST_PATH: ${{ runner.temp }}/candidate-source.json
        run: |
          GITHUB_SHA="$(git rev-parse HEAD)" node scripts/release-identity.js
          node scripts/rollback-drill.js --target "$(git rev-parse HEAD)"

      - name: Stage a broken release, revert through Git, and verify HTTP recovery
        run: node --test scripts/staging-rollback-e2e.test.js

      - name: Validate HU EN DE category hero and topic translations
        run: node --test scripts/category-locale.test.js

      - name: Guard localization inventory, wiring and terminology
        run: |
          node --test scripts/localization-foundation.test.js
          node --test scripts/depreciation-locale.test.js
          node --test scripts/floor-level-locale.test.js
          node --test scripts/sleep-cycle-locale.test.js
          node --test scripts/auto-locale.test.js
          node --test scripts/concrete-locale.test.js
          node --test scripts/csempe-locale.test.js
          node --test scripts/csemperagaszto-locale.test.js
          node --test scripts/bmi-locale.test.js
          node --test scripts/bmr-locale.test.js
          node --test scripts/derek-csipo-locale.test.js
          node --test scripts/deviza-locale.test.js
          node --test scripts/co2-locale.test.js
          node scripts/localization-inventory.js --check

      - name: Verify salary form and dynamic output translations
        run: node --test scripts/netto-brutto-locale.test.js

      - name: Check EN DE discount unit-price and average labels and errors
        run: node --test scripts/discount-unit-average-locale.test.js

      - name: Check EN DE margin markup and break-even translations
        run: node --test scripts/business-locale.test.js

      - name: Check EN DE date, age and date-difference translations
        run: node --test scripts/date-locale.test.js

      - name: Check EN DE working-hours, working-days and overtime translations
        run: node --test scripts/workday-locale.test.js

      - name: Check EN DE hourly wage, shared costs and recipe translations
        run: node --test scripts/hourly-utility-recipe-locale.test.js

      - name: Check EN DE electricity and water cost translations
        run: node --test scripts/household-utility-locale.test.js

      - name: Check EN DE savings goal and emergency fund translations
        run: node --test scripts/savings-reserve-locale.test.js

      - name: Check EN DE monthly budget translations
        run: node --test scripts/monthly-budget-locale.test.js

      - name: Check EN DE payment deadline and invoice tax point translations
        run: node --test scripts/invoice-date-locale.test.js

      - name: Check EN DE compound interest and millionaire goal translations
        run: node --test scripts/wealth-growth-locale.test.js

      - name: Check EN DE ETF and inflation translations
        run: node --test scripts/investment-inflation-locale.test.js

      - name: Check EN DE loan and borrowing capacity translations
        run: node --test scripts/credit-locale.test.js

      - name: Check EN DE mortgage planning and early repayment translations
        run: node --test scripts/mortgage-tools-locale.test.js

      - name: Check EN DE dividend calculator copy and dynamic results
        run: node --test scripts/dividend-locale.test.js

      - name: Verify localized VAT and percentage calculations without changing values
        run: node --test scripts/vat-percent-locale.test.js

      - name: Verify honest internal language fallback translations
        run: node --test scripts/site-language-inner.test.js

      - name: Verify shared navigation help and consent translations
        run: node --test scripts/shared-ui-locale.test.js

      - name: Test production monitoring classification and incident lifecycle
        run: node --test scripts/production-monitor-verdict.test.js scripts/production-monitor-incident.test.js

      - name: Test stable CI browser scope and merge gate
        run: node --test scripts/ci-browser-scope.test.js scripts/ci-browser-gate.test.js

      - name: Test Chrome timeout retry safety
        run: node --test scripts/chrome-render-retry.test.js

      - name: Test browser QA consent gate rejects regressions
        run: node --test scripts/browser-qa-policy-runner.test.js

      - name: Test shared AdSense page policy
        run: node --test scripts/adsense-policy.test.js scripts/publisher-ads.test.js scripts/adsense-cmp-wait.test.js

      - name: Test calculator scope isolation and collision detection
        run: node --test scripts/calculator-scopes.test.js

      - name: Test shared component lifecycle and load recovery
        run: node --test scripts/site-runtime.test.js

      - name: Test content-hash asset versions and dependency propagation
        run: node --test scripts/asset-versions.test.js

      - name: Guard the cleaned source against duplicate browser assets
        run: |
          node --test scripts/source-hygiene-audit.test.js
          node scripts/source-hygiene-audit.js

      - name: Prevent daily date-dependent static output drift
        run: node --test scripts/static-date-fallback.test.js scripts/sitemap-date-state.test.js

      - name: Test the single-pass static build contract
        run: npm run test:build-pipeline

      - name: Verify selectable salary tax-rate wiring
        run: node scripts/salary-rate-selector-audit.js

      - name: Verify committed asset fingerprints
        run: |
          node scripts/cache-bust-assets.js
          git diff --check
          git diff --exit-code || { echo 'Generated asset fingerprints must be committed.'; exit 1; }

      - name: Validate responsive viewport contract
        run: node scripts/responsive-contract-audit.js

      - name: Audit crawler-visible source HTML
        run: npm run static:check

      - name: Validate HTML, JavaScript and calculator logic
        run: npm run quality

      - name: Run final calculator inventory gate
        run: node scripts/final-fullsite-audit.js

      - name: Verify sitemap URL coverage
        run: npm run quality:3
