name: Site quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: site-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install validation dependencies
        run: npm ci

      - name: Generate expansion-aware sitemap in workspace
        run: npm run sitemap

      - name: Audit crawler-visible source HTML
        run: npm run static:check

      - name: Validate HTML, JavaScript and calculator logic
        run: npm run quality

      - name: Validate generated sitemap contains expansion batch
        run: |
          grep -q 'kalkulatorok/harmasszabaly-kalkulator.html' sitemap.xml
          grep -q 'kalkulatorok/szazalekos-valtozas-kalkulator.html' sitemap.xml
          grep -q 'kalkulatorok/csemperagaszto-kalkulator.html' sitemap.xml
          grep -q 'kalkulatorok/ev-toltesi-koltseg-kalkulator.html' sitemap.xml
          grep -q 'kalkulatorok/futotempo-kalkulator.html' sitemap.xml
