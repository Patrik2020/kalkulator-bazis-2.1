name: Browser regression

on:
  # Always run on PRs; a stable check is required even for editorial changes.
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Browser change scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_browser: ${{ steps.classify.outputs.run_browser }}
    steps:
      - name: Checkout PR with base and head history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"

      - name: Test CI scope classification and gate contract
        run: node --test scripts/ci-browser-scope.test.js scripts/ci-browser-gate.test.js

      - name: Decide if deep browser matrix is required
        id: classify
        env:
          KB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          KB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci-browser-scope.js

  smoke:
    # UI/runtime changes run the browser suite; editorial PRs skip its cost.
    needs: changes
    if: ${{ needs.changes.outputs.run_browser == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm

      - name: Install validation dependencies
        run: npm ci

      - name: Verify Chrome is available
        run: google-chrome --version

      - name: Run 30 calculator reference cases
        run: |
          if npm run test:reference:browser; then
            exit 0
          fi
          echo "Browser reference audit failed once; retrying after a short runner warm-up..." >&2
          sleep 3
          npm run test:reference:browser

      - name: Start local static server
        run: |
          node scripts/local-static-server.js > /tmp/kb-static-server.log 2>&1 &
          echo "KB_STATIC_SERVER_PID=$!" >> "$GITHUB_ENV"
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/kb-static-server.log
          exit 1

      - name: Verify decision and comparison switchers
        run: node scripts/decision-switcher-browser-audit.js

      - name: Smoke-test every calculator on responsive risk viewports
        run: npm run test:browser:all-calculators

      - name: Stop local static server
        if: always()
        run: |
          if [ -n "${KB_STATIC_SERVER_PID:-}" ]; then
            kill "$KB_STATIC_SERVER_PID" || true
          fi

  deep-ui-qa:
    # Run all required browser tests before merge, including bot authored PRs.
    needs: changes
    if: ${{ needs.changes.outputs.run_browser == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm

      - name: Install validation dependencies
        run: npm ci

      - name: Verify Chrome is available
        run: google-chrome --version

      - name: Start local static server
        run: |
          node scripts/local-static-server.js > /tmp/kb-static-server.log 2>&1 &
          echo "KB_STATIC_SERVER_PID=$!" >> "$GITHUB_ENV"
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/kb-static-server.log
          exit 1

      - name: Run deep mobile and desktop UI QA
        env:
          CHROME_EXTRA_ARGS: --disable-dev-shm-usage
        run: npm run test:browser:ui

      - name: Stop local static server
        if: always()
        run: |
          if [ -n "${KB_STATIC_SERVER_PID:-}" ]; then
            kill "$KB_STATIC_SERVER_PID" || true
          fi
  
  gate:
    name: Browser regression gate
    # This stable status always exists, even if upstream jobs fail or skip.
    if: ${{ always() }}
    needs: [changes, smoke, deep-ui-qa]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout gate contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Verify browser obligations
        env:
          KB_CHANGES_RESULT: ${{ needs.changes.result }}
          KB_RUN_BROWSER: ${{ needs.changes.outputs.run_browser }}
          KB_SMOKE_RESULT: ${{ needs.smoke.result }}
          KB_DEEP_RESULT: ${{ needs.deep-ui-qa.result }}
        run: node scripts/ci-browser-gate.js
