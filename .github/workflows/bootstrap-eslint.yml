name: Bootstrap ESLint dependencies

on:
  push:
    branches:
      - chore/clean-code-1-1-eslint

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: chore/clean-code-1-1-eslint

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Wire ESLint into package scripts
        run: |
          npm pkg set 'scripts.lint:js:syntax=node scripts/check-js-syntax.js'
          npm pkg set 'scripts.lint:js=npm run lint:js:syntax && eslint "js/**/*.js" "scripts/**/*.js" "worker/src/**/*.js"'
          if ! git diff --quiet -- package.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package.json
            git commit -m "chore: run ESLint in JavaScript quality gate"
            git push origin HEAD:chore/clean-code-1-1-eslint
          fi

      - name: Run ESLint baseline
        run: npm run lint:js
