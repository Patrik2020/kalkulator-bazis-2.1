name: Bootstrap ESLint dependencies

on:
  push:
    branches:
      - chore/clean-code-1-1-eslint

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: chore/clean-code-1-1-eslint

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install pinned ESLint dependencies
        run: npm install --save-dev --save-exact eslint@10.11.0 globals@17.12.0

      - name: Commit lockfile update when needed
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "ESLint dependencies already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "build: add pinned ESLint dependencies"
          git push origin HEAD:chore/clean-code-1-1-eslint
