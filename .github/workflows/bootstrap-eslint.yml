name: Bootstrap ESLint dependencies

on:
  push:
    branches:
      - chore/clean-code-1-1-eslint

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: chore/clean-code-1-1-eslint

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Keep ESLint package scripts synchronized
        run: |
          npm pkg set 'scripts.lint:js:syntax=node scripts/check-js-syntax.js'
          npm pkg set 'scripts.lint:js=npm run lint:js:syntax && eslint "js/**/*.js" "scripts/**/*.js" "worker/src/**/*.js"'

      - name: Normalize regex whitespace found by ESLint
        run: |
          node <<'NODE'
          const fs = require('fs');

          const transforms = [
            {
              file: 'scripts/apply-adsense-eligibility-v2.js',
              map(line) {
                if (!line.includes('const syncPattern =')) return line;
                return line
                  .replace('/  const syncAdSense', '/ {2}const syncAdSense')
                  .replace('\\n  \\};\\n\\n  const persistConsent', '\\n {2}\\};\\n\\n {2}const persistConsent');
              },
            },
            {
              file: 'scripts/apply-category-taxonomy.js',
              map(line) {
                if (!line.includes('const categoryPattern =')) return line;
                return line.replace('\\n  \\];\\n\\n  const calculators', '\\n {2}\\];\\n\\n {2}const calculators');
              },
            },
            {
              file: 'scripts/browser-qa-shard.js',
              map(line) {
                if (!line.includes('const viewportBlock =')) return line;
                return line.replace('\\n  \\];/', '\\n {2}\\];/');
              },
            },
          ];

          for (const { file, map } of transforms) {
            const before = fs.readFileSync(file, 'utf8');
            const after = before.split('\n').map(map).join('\n');
            if (after !== before) fs.writeFileSync(file, after);
          }
          NODE

      - name: Commit generated ESLint setup changes when needed
        run: |
          if git diff --quiet -- package.json scripts/apply-adsense-eligibility-v2.js scripts/apply-category-taxonomy.js scripts/browser-qa-shard.js; then
            echo "ESLint setup already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json scripts/apply-adsense-eligibility-v2.js scripts/apply-category-taxonomy.js scripts/browser-qa-shard.js
          git commit -m "chore: fix ESLint correctness baseline"
          git push origin HEAD:chore/clean-code-1-1-eslint

      - name: Run ESLint baseline
        run: npm run lint:js
