name: Bootstrap Clean Code 1.2

on:
  push:
    branches:
      - chore/clean-code-1-2-final

permissions:
  contents: write

concurrency:
  group: clean-code-1-2-bootstrap
  cancel-in-progress: true

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: chore/clean-code-1-2-final

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Wire global-head materialization and quality gates
        run: |
          node <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.scripts['head-config:apply'] = 'node scripts/apply-global-head-config.js';
          pkg.scripts['quality:head-config'] = 'node scripts/global-head-contract-audit.js';
          if (!pkg.scripts.quality.includes('npm run quality:head-config')) {
            pkg.scripts.quality = pkg.scripts.quality.replace(
              'npm run quality:assets && ',
              'npm run quality:assets && npm run quality:head-config && '
            );
          }
          if (!pkg.scripts['static:build'].startsWith('npm run head-config:apply && ')) {
            pkg.scripts['static:build'] = `npm run head-config:apply && ${pkg.scripts['static:build']}`;
          }
          fs.writeFileSync('package.json', `${JSON.stringify(pkg, null, 2)}\n`);
          NODE

      - name: Materialize config before bootstrap
        run: node scripts/apply-global-head-config.js

      - name: Refresh content-hash asset versions
        run: node scripts/cache-bust-assets.js

      - name: Validate Clean Code 1.2 contract
        run: |
          npm run lint:js
          npm run quality:assets
          npm run quality:head-config
          npm run static:check

      - name: Commit generated refactor output
        run: |
          if git diff --quiet; then
            echo "Clean Code 1.2 already materialized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json js/global-head-config.js js/global-head.js js/home-plugin-fallback.js scripts '*.html' aktualis kalkulatorok landing-pages
          git commit -m "refactor: materialize global-head config before bootstrap"
          git push origin HEAD:chore/clean-code-1-2-final
