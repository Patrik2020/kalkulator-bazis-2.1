name: Prepare expansion branch

on:
  push:
    branches:
      - expansion-100-batch-01-2026-08

permissions:
  contents: write

concurrency:
  group: prepare-expansion-100-batch-01
  cancel-in-progress: true

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate sitemap
        run: npm run sitemap

      - name: Commit generated sitemap
        shell: bash
        run: |
          if git diff --quiet -- sitemap.xml; then
            echo "Sitemap is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git commit -m "build: refresh sitemap for expansion batch [skip ci]"
          git push origin HEAD:expansion-100-batch-01-2026-08
