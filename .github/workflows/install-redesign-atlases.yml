name: Install true high-res redesign atlases

on:
  push:
    paths:
      - '.asset-upload/READY'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Rebuild and verify AVIF atlases
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p images/redesign
          cat .asset-upload/category-*.b64 | base64 --decode > images/redesign/category-atlas.avif
          cat .asset-upload/season-*.b64 | base64 --decode > images/redesign/season-atlas.avif
          echo "1a89acc0bc3a080b04726959d998a364f9d554254f42a0f3bad3ec25b4511551  images/redesign/category-atlas.avif" | sha256sum -c -
          echo "399745a63b9760ad1ace18ae2c672c0d80f6c5e46aacae3288a0525a19f9d77a  images/redesign/season-atlas.avif" | sha256sum -c -
          test "$(wc -c < images/redesign/category-atlas.avif)" -eq 206830
          test "$(wc -c < images/redesign/season-atlas.avif)" -eq 319207
          python - <<'PY'
          from pathlib import Path
          p = Path('css/pages/home-redesign-assets.css')
          s = p.read_text()
          s = s.replace('20260923-1', '20260923-2')
          p.write_text(s)
          PY
          rm -rf .asset-upload
          rm -f .github/workflows/install-redesign-atlases.yml

      - name: Commit installed assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace redesign atlases with true high-resolution originals"
          git push origin HEAD:${{ github.ref_name }}
