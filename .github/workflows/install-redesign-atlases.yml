name: Install high-res redesign atlases

on:
  push:
    paths:
      - '.asset-upload/READY'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Rebuild WebP atlases from staged chunks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p images/redesign
          cat .asset-upload/category-*.b64 | base64 --decode > images/redesign/category-atlas.webp
          cat .asset-upload/season-*.b64 | base64 --decode > images/redesign/season-atlas.webp
          python - <<'PY'
          from pathlib import Path
          p = Path('css/pages/home-redesign-assets.css')
          s = p.read_text()
          s = s.replace('20260921-2', '20260923-1')
          p.write_text(s)
          PY
          rm -rf .asset-upload
          rm -f .github/workflows/install-redesign-atlases.yml

      - name: Commit installed assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace blurry redesign artwork with high-resolution originals"
          git push origin HEAD:${{ github.ref_name }}
