name: Install true high-res redesign atlases

on:
  push:
    paths:
      - '.asset-upload/READY'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Rebuild and verify AVIF atlases
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p images/redesign
          cat .asset-upload/category-*.b64 | base64 --decode > images/redesign/category-atlas.avif
          cat .asset-upload/season-*.b64 | base64 --decode > images/redesign/season-atlas.avif
          echo "d774105ea1c011926986ab3b56c424ab3089532c47640aa00bcbf87afa098074  images/redesign/category-atlas.avif" | sha256sum -c -
          echo "6a6b54ac632eb46d8517d0115b91dad432147755f3c411575522801ba7a0f8a8  images/redesign/season-atlas.avif" | sha256sum -c -
          test "$(wc -c < images/redesign/category-atlas.avif)" -eq 138265
          test "$(wc -c < images/redesign/season-atlas.avif)" -eq 210171
          python - <<'PY'
          from pathlib import Path
          p = Path('css/pages/home-redesign-assets.css')
          s = p.read_text()
          s = s.replace('20260923-1', '20260923-2')
          p.write_text(s)
          PY
          rm -rf .asset-upload
          rm -f .github/workflows/install-redesign-atlases.yml

      - name: Commit installed assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace redesign atlases with true high-resolution originals"
          git push origin HEAD:${{ github.ref_name }}
