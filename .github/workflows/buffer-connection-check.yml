name: Buffer Facebook connection check

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/buffer-connection-check.yml
      - scripts/check-buffer-connection.mjs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: buffer-connection-check
  cancel-in-progress: false

jobs:
  verify:
    name: Verify Buffer API and Facebook Page
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
      - name: Validate Buffer connection (read-only)
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: node scripts/check-buffer-connection.mjs
