name: Buffer daily illustrated Facebook

on:
  pull_request:
    paths:
      - .github/workflows/buffer-daily-facebook.yml
      - scripts/buffer-facebook-post-bank.mjs
      - scripts/schedule-buffer-facebook.mjs
      - scripts/buffer-facebook-posts.test.mjs
      - scripts/buffer-facebook-images.mjs
      - assets/social/facebook/**
  push:
    branches: [main]
    paths:
      - .github/workflows/buffer-daily-facebook.yml
      - scripts/buffer-facebook-post-bank.mjs
      - scripts/schedule-buffer-facebook.mjs
      - scripts/buffer-facebook-posts.test.mjs
      - scripts/buffer-facebook-images.mjs
      - assets/social/facebook/**
  schedule:
    # Schedules NEXT day's 08:00 Europe/Budapest post, safely ahead of time.
    - cron: '13 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: buffer-facebook-daily
  cancel-in-progress: false

jobs:
  test-post-generator:
    name: Validate curated posts, PNG assets and timezones
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - name: Test calculations, content, daylight saving
        run: node --test scripts/buffer-facebook-posts.test.mjs
      - name: Preview upcoming post without Buffer access
        run: node scripts/schedule-buffer-facebook.mjs

  schedule-next-post:
    name: Schedule one image+text Facebook post
    needs: test-post-generator
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - name: Verify image URL, avoid duplicate and schedule next day
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          ALLOW_BUFFER_POSTING: 'true'
        run: node scripts/schedule-buffer-facebook.mjs
