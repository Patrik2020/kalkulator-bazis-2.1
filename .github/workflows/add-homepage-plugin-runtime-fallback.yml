name: Add homepage ChatGPT runtime fallback

on:
  push:
    branches:
      - fix/homepage-stale-sw-v3

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/homepage-stale-sw-v3

      - name: Add runtime fallback
        shell: bash
        run: |
          python3 -c "from pathlib import Path; import base64; p=Path('js/global-head.js'); t=p.read_text(encoding='utf-8'); a=base64.b64decode('').decode('utf-8'); p.write_text(t if 'KB_CHATGPT_PLUGIN_HOME_FALLBACK' in t else t+a, encoding='utf-8')"

      - name: Commit runtime fallback and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/add-homepage-plugin-runtime-fallback.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/global-head.js .github/workflows/add-homepage-plugin-runtime-fallback.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix: render ChatGPT announcement on stale homepage HTML"
          git push