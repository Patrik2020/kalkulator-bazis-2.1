name: Prepare calculator expansion batch 1

on:
  push:
    branches:
      - calculator-expansion-batch1-2026-08

permissions:
  contents: write

concurrency:
  group: prepare-calculator-expansion-batch1
  cancel-in-progress: true

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout expansion branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install validation dependencies
        run: npm ci

      - name: Generate first expansion batch
        run: node scripts/add-calculator-expansion-batch1.js

      - name: Apply taxonomy and regenerate sitemap
        run: |
          npm run taxonomy:apply
          npm run sitemap

      - name: Verify Chrome is available
        shell: bash
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            google-chrome --version
          elif command -v chromium >/dev/null 2>&1; then
            chromium --version
          else
            echo "Chrome/Chromium is required for DOM materialization." >&2
            exit 1
          fi

      - name: Materialize static-first HTML
        run: |
          npm run static:materialize
          npm run static:normalize

      - name: Audit crawler-visible source HTML
        run: npm run static:check

      - name: Validate HTML, JavaScript and calculator logic
        run: npm run quality

      - name: Check whitespace errors
        run: git diff --check

      - name: Commit generated expansion
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Expansion output is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "build: materialize calculator expansion batch 1 [skip ci]"
          git push origin HEAD:calculator-expansion-batch1-2026-08
