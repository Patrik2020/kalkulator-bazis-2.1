name: Materialize static-first HTML

on:
  workflow_dispatch:
  # A full 132-page Chrome rebuild is for generator/runtime changes, not news articles.
  # Editorial HTML, sitemap and ordinary content changes are validated by Site quality.
  pull_request:
    paths:
      - "scripts/apply-*.js"
      - "scripts/materialize-static-first.js"
      - "scripts/chrome-render-retry.js"
      - "scripts/normalize-static-html.js"
      - "scripts/normalize-a11y-html.js"
      - "scripts/normalize-retention-static.js"
      - "scripts/cache-bust-assets.js"
      - "scripts/asset-versions.js"
      - "scripts/generate-sitemap.js"
      - "scripts/quarantine-legacy-category-generator.js"
      - "scripts/url-paths.js"
      - "js/global-head.js"
      - "js/global-head-config.js"
      - "js/static-first-fallbacks.js"
      - "css/layout/**"
      - "components/**"
      - "package.json"
      - "package-lock.json"
  push:
    branches:
      - adsense-quality-v2

permissions:
  contents: read

concurrency:
  group: static-first-${{ github.ref }}
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout tested commit (never mutate PR branch)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm

      - name: Install validation dependencies
        run: npm ci

      - name: Verify Chrome is available
        shell: bash
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            google-chrome --version
          elif command -v chromium >/dev/null 2>&1; then
            chromium --version
          else
            echo "Chrome/Chromium is required for DOM materialization." >&2
            exit 1
          fi

      - name: Apply AdSense template fingerprint cleanup
        run: node scripts/apply-adsense-template-fingerprint-v2.js

      - name: Apply page-specific domain methodology
        run: node scripts/apply-adsense-domain-method-copy-v2.js

      - name: Preserve construction manufacturer-first safety rule
        run: node scripts/apply-construction-manufacturer-first-v2.js

      - name: Remove legacy YMYL ownership boilerplate
        run: node scripts/apply-adsense-ymyl-trust-v2.js

      - name: Apply primary YMYL source notes
        run: node scripts/apply-adsense-source-notes-v2.js

      - name: Apply current-content editorial moat
        run: node scripts/apply-adsense-current-moat-v2.js

      - name: Apply Phase 2 converter consolidation
        run: node scripts/apply-adsense-phase2-consolidation.js

      - name: Apply Phase 2 Batch 2 average consolidation
        run: node scripts/apply-adsense-phase2-batch2.js

      - name: Apply average hub quality blocks
        run: node scripts/apply-average-hub-quality-blocks.js

      - name: Protect average hub from legacy renderer
        run: node scripts/apply-average-hub-runtime-guard.js

      - name: Apply AdSense eligibility and certified-CMP runtime gate
        run: node scripts/apply-adsense-eligibility-v2.js

      - name: Apply AdSense audit policy normalization
        run: node scripts/apply-adsense-audit-policy-v2.js

      - name: Materialize global head config include
        run: node scripts/apply-global-head-config.js

      - name: Materialize public taxonomy
        run: npm run taxonomy:apply

      - name: Generate sitemap for page discovery
        run: npm run sitemap

      - name: Materialize and normalize browser-rendered content
        run: npm run static:build

      - name: Normalize final static output
        run: npm run static:normalize

      - name: Re-apply editorial transforms after materialization
        run: |
          node scripts/apply-adsense-domain-method-copy-v2.js
          node scripts/apply-construction-manufacturer-first-v2.js
          node scripts/apply-adsense-ymyl-trust-v2.js
          node scripts/apply-adsense-source-notes-v2.js
          node scripts/apply-adsense-current-moat-v2.js
          node scripts/apply-adsense-phase2-consolidation.js
          node scripts/apply-adsense-phase2-batch2.js
          node scripts/apply-average-hub-quality-blocks.js

      - name: Canonicalize static retention CTA state
        run: node scripts/normalize-retention-static.js

      - name: Apply content-hash asset versions
        run: node scripts/cache-bust-assets.js

      - name: Refresh sitemap after materialization
        run: npm run sitemap

      - name: Stabilize newly materialized pages
        shell: bash
        run: |
          node scripts/apply-global-head-config.js
          npm run static:build
          npm run static:normalize
          node scripts/apply-adsense-domain-method-copy-v2.js
          node scripts/apply-construction-manufacturer-first-v2.js
          node scripts/apply-adsense-ymyl-trust-v2.js
          node scripts/apply-adsense-source-notes-v2.js
          node scripts/apply-adsense-current-moat-v2.js
          node scripts/apply-adsense-phase2-consolidation.js
          node scripts/apply-adsense-phase2-batch2.js
          node scripts/apply-average-hub-quality-blocks.js
          node scripts/normalize-retention-static.js
          node scripts/cache-bust-assets.js
          npm run sitemap

      - name: Verify static build is idempotent
        shell: bash
        run: |
          git diff --binary > "${RUNNER_TEMP}/static-stable-pass.diff"
          node scripts/apply-global-head-config.js
          npm run static:build
          npm run static:normalize
          node scripts/apply-adsense-domain-method-copy-v2.js
          node scripts/apply-construction-manufacturer-first-v2.js
          node scripts/apply-adsense-ymyl-trust-v2.js
          node scripts/apply-adsense-source-notes-v2.js
          node scripts/apply-adsense-current-moat-v2.js
          node scripts/apply-adsense-phase2-consolidation.js
          node scripts/apply-adsense-phase2-batch2.js
          node scripts/apply-average-hub-quality-blocks.js
          node scripts/normalize-retention-static.js
          node scripts/cache-bust-assets.js
          npm run sitemap
          git diff --binary > "${RUNNER_TEMP}/static-verification-pass.diff"
          diff -u \
            "${RUNNER_TEMP}/static-stable-pass.diff" \
            "${RUNNER_TEMP}/static-verification-pass.diff"

      # Full JavaScript/calculator/AdSense validation runs in dedicated workflows.
      # Keep only generated-output integrity checks here before the bot commits.
      - name: Audit crawler-visible source HTML
        run: npm run static:check

      - name: Run final calculator inventory gate
        run: node scripts/final-fullsite-audit.js

      - name: Audit canonical URL policy
        run: npm run quality:urls

      - name: Validate content-aware sitemap lastmod
        run: node scripts/sitemap-lastmod-v2-audit.js

      - name: Verify generated sitemap is idempotent
        shell: bash
        run: |
          cp sitemap.xml "${RUNNER_TEMP}/sitemap.xml"
          cp data/sitemap-content-state.json "${RUNNER_TEMP}/sitemap-content-state.json"
          npm run sitemap
          diff -u "${RUNNER_TEMP}/sitemap.xml" sitemap.xml
          diff -u "${RUNNER_TEMP}/sitemap-content-state.json" data/sitemap-content-state.json

      - name: Check whitespace errors
        run: git diff --check

      # PR validation must never commit to or push an author's branch. The
      # same checked-out SHA is tested by every job, with no surprise bot commits.
      - name: Verify committed generated output matches source
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --binary > "${RUNNER_TEMP}/static-first-drift.patch"
          untracked="$(git ls-files --others --exclude-standard)"
          if [[ -s "${RUNNER_TEMP}/static-first-drift.patch" || -n "$untracked" ]]; then
            echo "::error title=Stale generated output::The checked-in static files differ from the deterministic generator. Generate locally, review the diff, and commit only intended changes. This workflow will not push to a PR."
            git diff --stat
            git status --short --untracked-files=all
            exit 1
          fi
          echo "Generated output matches the source; no surprise changes."

      - name: Upload drift patch for inspection
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: static-first-drift
          path: ${{ runner.temp }}/static-first-drift.patch
          if-no-files-found: ignore
          retention-days: 7
