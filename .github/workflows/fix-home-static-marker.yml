name: Fix V17 static quality marker

on:
  push:
    paths:
      - '.home-redesign/FIX_MARKER'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Add final-quality marker to V17 source and materialized homepage
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          marker = '<!-- KB_STATIC:quality-final:START -->\n<!-- KB_STATIC:quality-final:END -->'
          for filename in ['fragments/home-redesign-v17-main.inc', 'index.html']:
              p = Path(filename)
              s = p.read_text(encoding='utf-8')
              if 'KB_STATIC:quality-final:START' not in s:
                  if '</main>' not in s:
                      raise SystemExit(f'{filename}: closing main not found')
                  s = s.replace('</main>', marker + '\n</main>', 1)
                  p.write_text(s, encoding='utf-8')
          PY
          node scripts/static-first-audit.js

      - name: Commit marker repair
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .home-redesign
          rm -f .github/workflows/fix-home-static-marker.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Preserve static quality marker in V17 homepage"
          git push origin HEAD:${{ github.ref_name }}
