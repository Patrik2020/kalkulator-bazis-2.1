name: Privacy consent bulk fix

on:
  push:
    branches: [fix/privacy-consent-api]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/privacy-consent-api
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply privacy and consent consistency fixes
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const root = process.cwd();
          const read = (p) => fs.readFileSync(path.join(root, p), 'utf8');
          const write = (p, s) => fs.writeFileSync(path.join(root, p), s, 'utf8');
          const replaceOnce = (text, from, to, label) => {
            if (!text.includes(from)) throw new Error(`Missing expected text: ${label}`);
            return text.replace(from, to);
          };

          // 1) Remove every eager AdSense loader from HTML. The harmless account meta tag stays.
          const adsenseTag = /<script\b(?=[^>]*\bsrc=["']https:\/\/pagead2\.googlesyndication\.com\/pagead\/js\/adsbygoogle\.js\?client=ca-pub-2639795157074812["'])[^>]*><\/script>\s*/gi;
          let htmlTouched = 0;
          const walk = (dir) => {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(full);
              else if (entry.isFile() && entry.name.endsWith('.html')) {
                const original = fs.readFileSync(full, 'utf8');
                const next = original.replace(adsenseTag, '');
                if (next !== original) {
                  fs.writeFileSync(full, next, 'utf8');
                  htmlTouched += 1;
                }
              }
            }
          };
          walk(root);
          console.log(`Removed eager AdSense loader from ${htmlTouched} HTML files.`);

          // 2) Cookie manager: new consent version + consent-gated, non-personalized AdSense.
          let cookie = read('js/cookie.js');
          cookie = replaceOnce(cookie,
            'const consentVersion = "2026-06-26.v2";',
            'const consentVersion = "2026-08-12.v3";',
            'consent version');
          cookie = replaceOnce(cookie,
            '  const adsId = "AW-18204925339";\n',
            '  const adsId = "AW-18204925339";\n  const adsenseClient = "ca-pub-2639795157074812";\n\n  // AdSense requests remain paused until explicit advertising consent.\n  window.adsbygoogle = window.adsbygoogle || [];\n  window.adsbygoogle.pauseAdRequests = 1;\n  window.adsbygoogle.requestNonPersonalizedAds = 1;\n',
            'AdSense constants');

          const loadGoogleTagEnd = '    document.head.appendChild(script);\n    configure();\n  };\n\n  const persistConsent = (categories) => {';
          const adsenseLoader = `    document.head.appendChild(script);\n    configure();\n  };\n\n  const syncAdSense = () => {\n    const queue = (window.adsbygoogle = window.adsbygoogle || []);\n\n    // For now the site requests only non-personalized AdSense ads. Even those\n    // remain fully disabled until the visitor accepts the advertising category.\n    queue.requestNonPersonalizedAds = 1;\n\n    if (!hasConsent("ads")) {\n      queue.pauseAdRequests = 1;\n      return;\n    }\n\n    queue.pauseAdRequests = 1;\n    const existing = document.querySelector(\n      'script[src^="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js"]'\n    );\n\n    const resumeRequests = () => {\n      queue.requestNonPersonalizedAds = 1;\n      queue.pauseAdRequests = 0;\n    };\n\n    if (existing) {\n      resumeRequests();\n      return;\n    }\n\n    const script = document.createElement("script");\n    script.async = true;\n    script.crossOrigin = "anonymous";\n    script.dataset.kbConsentManaged = "adsense";\n    script.src = \`https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=\${adsenseClient}\`;\n    script.addEventListener("load", resumeRequests, { once: true });\n    document.head.appendChild(script);\n  };\n\n  const persistConsent = (categories) => {`;
          cookie = replaceOnce(cookie, loadGoogleTagEnd, adsenseLoader, 'AdSense loader insertion');
          cookie = replaceOnce(cookie,
            '    updateConsentControlledAssets(currentConsent.categories);\n    loadGoogleTag();\n    dispatchConsentEvent();',
            '    updateConsentControlledAssets(currentConsent.categories);\n    loadGoogleTag();\n    syncAdSense();\n    dispatchConsentEvent();',
            'persist consent AdSense sync');
          cookie = replaceOnce(cookie,
            '      updateConsentControlledAssets(currentConsent.categories);\n      loadGoogleTag();\n      closeModal(false);',
            '      updateConsentControlledAssets(currentConsent.categories);\n      loadGoogleTag();\n      syncAdSense();\n      closeModal(false);',
            'saved consent AdSense sync');
          cookie = replaceOnce(cookie,
            '      updateGoogleConsent(defaultCategories);\n      updateConsentControlledAssets(defaultCategories);\n      openModal();',
            '      updateGoogleConsent(defaultCategories);\n      updateConsentControlledAssets(defaultCategories);\n      syncAdSense();\n      openModal();',
            'default consent AdSense sync');
          write('js/cookie.js', cookie);

          // 3) Shadow API: technical test is opt-in only. Normal visitors stay local-only.
          let shadow = read('js/penzugyi/netto-brutto-shadow.js');
          shadow = replaceOnce(shadow,
            '  function schedule(job) {\n    sequence += 1;',
            `  function isDebugEnabled() {\n    try {\n      return window.localStorage?.getItem("kbSalaryShadowDebug") === "1";\n    } catch {\n      return false;\n    }\n  }\n\n  function schedule(job) {\n    if (!isDebugEnabled()) {\n      cancel();\n      return;\n    }\n\n    sequence += 1;`,
            'shadow debug gate');
          write('js/penzugyi/netto-brutto-shadow.js', shadow);

          // 4) Privacy notice: make browser/API behavior and legal bases accurate.
          let privacy = read('adatvedelem.html');
          const oldCalculatorPrivacy = `    <p>\n      A weboldalon található kalkulátorok használata során megadott értékek\n      (például kezdő tőke, havi befizetés vagy hozam) kizárólag a látogató\n      böngészőjében kerülnek feldolgozásra. Ezeket az értékeket nem küldjük el\n      szerverre, kivéve, ha a látogató a hibabejelentő szövegmezőjében maga írja\n      le és küldi be őket.\n    </p>\n\n    <ul>\n      <li>nem kerülnek elküldésre szerverre</li>\n      <li>nem kerülnek tárolásra</li>\n      <li>nem kapcsolhatók személyhez</li>\n    </ul>`;
          const newCalculatorPrivacy = `    <p>\n      A kalkulátorok többsége a megadott értékeket kizárólag a látogató\n      böngészőjében dolgozza fel. Egyes, kifejezetten API-t használó vagy\n      technikai tesztmódban működő funkcióknál a számításhoz szükséges értékek\n      HTTPS-kapcsolaton keresztül a Kalkulátor Bázis API-jához is továbbításra\n      kerülhetnek.\n    </p>\n\n    <ul>\n      <li>a helyben működő kalkulátorok mezőértékei nem hagyják el a böngészőt</li>\n      <li>API-hívásnál csak a számításhoz szükséges adatokat továbbítjuk</li>\n      <li>a Kalkulátor Bázis API alkalmazásnaplói szándékosan nem rögzítik a kalkulátor request body-k tartalmát</li>\n      <li>a kalkulátoradatokat nem használjuk profilalkotásra vagy hirdetési célra</li>\n    </ul>\n\n    <p>\n      A nettó–bruttó kalkulátor jelenlegi háttér-összehasonlító (shadow) API-tesztje\n      normál látogatóknál nincs bekapcsolva; kizárólag manuálisan aktivált technikai\n      tesztmódban fut. Ilyenkor a megadott bér- és kedvezményadatok az API-hoz kerülnek\n      a helyi és a szerveroldali számítás összevetéséhez.\n    </p>`;
          privacy = replaceOnce(privacy, oldCalculatorPrivacy, newCalculatorPrivacy, 'calculator privacy paragraph');

          const hostingParagraph = `    <p>\n      A tárhely kiszolgálásakor a szolgáltató technikailag szükséges kapcsolati\n      adatokat (például IP-címet, időpontot és böngészőazonosítót) kezelhet a\n      biztonságos működés és a visszaélések megelőzése érdekében.\n    </p>`;
          const hostingPlusApi = `${hostingParagraph}\n\n    <h2>Kalkulátor API és technikai naplók</h2>\n\n    <p>\n      Az API-infrastruktúrát a Render Services, Inc. biztosítja. Az API használatakor\n      a szolgáltató a kapcsolat kiszolgálásához szükséges technikai adatokat, például\n      IP-címet, időpontot, kért útvonalat, HTTP-metódust és válaszkódot kezelhet. A\n      Kalkulátor Bázis API nem hoz létre felhasználói profilt, és a kalkulátorok\n      request body-ját nem naplózzuk alkalmazásszinten.\n    </p>\n\n    <p>\n      A Render technikai logjainak megőrzése a használt csomagtól függ; a jelenlegi\n      Hobby munkaterületen a szolgáltató dokumentációja szerint a naplók legfeljebb\n      7 napig érhetők el. A szolgáltató adatfeldolgozási feltételei és nemzetközi\n      adattovábbítási garanciái a Render saját adatvédelmi dokumentumaiban találhatók.\n    </p>`;
          privacy = replaceOnce(privacy, hostingParagraph, hostingPlusApi, 'API privacy section');

          const purposeList = `    <ul>\n      <li>a weboldal működésének biztosítása</li>\n      <li>a felhasználói élmény javítása</li>\n      <li>látogatottsági statisztikák készítése</li>\n      <li>hirdetési és partneri konverziók mérése a hozzájárulási állapot szerint</li>\n      <li>kérdések és hibabejelentések megválaszolása, kivizsgálása</li>\n    </ul>`;
          const purposeAndBasis = `${purposeList}\n\n    <h2>Adatkezelés jogalapja</h2>\n\n    <ul>\n      <li><strong>Szükséges technikai működés és biztonság:</strong> az adatkezelő jogos érdeke a szolgáltatás biztonságos és megbízható működtetése (GDPR 6. cikk (1) f)).</li>\n      <li><strong>API-s minőségellenőrzés:</strong> az adatkezelő jogos érdeke a kalkulációk pontosságának és megbízhatóságának ellenőrzése; ezt adatminimalizálással, profilalkotás nélkül és a jelenlegi shadow tesztnél kizárólag manuális technikai tesztmódban végezzük (GDPR 6. cikk (1) f)).</li>\n      <li><strong>Analitika, hirdetés és marketing:</strong> a látogató hozzájárulása (GDPR 6. cikk (1) a)); az opcionális tárolás és külső hirdetési technológiák csak a megfelelő választás után aktiválódnak.</li>\n      <li><strong>Segítség- és hibabejelentés:</strong> a beküldés előtt adott hozzájárulás (GDPR 6. cikk (1) a)).</li>\n    </ul>\n\n    <p>\n      A jogos érdeken alapuló adatkezelés ellen a látogató a lent megadott\n      elérhetőségen tiltakozhat. Az adatkezelő az ilyen adatkezeléseknél a cél\n      szükségességét, az érintetti hatást és az alkalmazott garanciákat rendszeresen\n      felülvizsgálja.\n    </p>`;
          privacy = replaceOnce(privacy, purposeList, purposeAndBasis, 'legal bases');
          privacy = replaceOnce(privacy,
            '      <li>GitHub Pages (a weboldal tárhelyszolgáltatása)</li>',
            '      <li>GitHub Pages (a weboldal tárhelyszolgáltatása)</li>\n      <li>Render Services, Inc. (a Kalkulátor Bázis API infrastruktúrája)</li>',
            'Render provider');
          privacy = privacy.replace('Utolsó frissítés: 2026.08.07.', 'Utolsó frissítés: 2026.08.12.');
          write('adatvedelem.html', privacy);

          // 5) Cookie notice: describe actual loading behavior and conservative NPA mode.
          let cookiePage = read('cookie.html');
          cookiePage = replaceOnce(cookiePage,
            `      A Kalkulátor Bázis a weboldal működéséhez helyi böngészőtárolást használ.\n      A Google Analytics és Google Ads címkék hozzájárulási módban,\n      alapértelmezett tiltott állapottal betöltődhetnek, míg az opcionális\n      analitikai és hirdetési tárolás csak a látogató hozzájárulása után kapcsol be.`,
            `      A Kalkulátor Bázis a weboldal működéséhez helyi böngészőtárolást használ.\n      Az opcionális Google Analytics, Google Ads és Google AdSense külső scriptek\n      csak a látogató megfelelő hozzájárulása után töltődnek be. Hozzájárulás\n      nélkül az analitikai és hirdetési kategória tiltott marad.`,
            'cookie intro');
          cookiePage = replaceOnce(cookiePage,
            `        <strong>Analitika:</strong> a Google Analytics címke hozzájárulási\n        módban betöltődhet. Analitikai sütik és teljes mérés csak hozzájárulás\n        után használhatók.`,
            `        <strong>Analitika:</strong> a Google Analytics külső címkéje csak\n        analitikai hozzájárulás után töltődik be és kezd mérést.`,
            'analytics cookie wording');
          cookiePage = replaceOnce(cookiePage,
            `        <strong>Hirdetés és marketing:</strong> a Google Ads címke\n        hozzájárulási módban betöltődhet, de hirdetési tárolás és személyre\n        szabás csak hozzájárulás után engedélyezett. A Google AdSense\n        hirdetések, partneri bannerek és külső kreatívok szintén csak\n        hirdetési/marketing hozzájárulás után töltenek be.`,
            `        <strong>Hirdetés és marketing:</strong> a Google Ads, Google AdSense,\n        partneri bannerek és külső kreatívok csak hirdetési/marketing hozzájárulás\n        után töltenek be. A Kalkulátor Bázis az AdSense esetében jelenleg kizárólag\n        nem személyre szabott hirdetési kéréseket engedélyez. Ezek a Google\n        tájékoztatása szerint továbbra is használhatnak sütiket vagy azonosítókat\n        például gyakoriságkorlátozáshoz és összesített hirdetési jelentésekhez.`,
            'ads cookie wording');
          cookiePage = replaceOnce(cookiePage,
            `      Hozzájárulás nélkül az analitikai és hirdetési tárolás tiltott. A Google\n      címkék ilyenkor korlátozott, süti nélküli technikai jelzéseket küldhetnek\n      a hozzájárulási mód működésének megfelelően.`,
            `      Hozzájárulás nélkül az analitikai és hirdetési külső scriptek nem\n      töltődnek be, az AdSense hirdetési kérések pedig szüneteltetve maradnak.`,
            'no consent wording');
          cookiePage = cookiePage.replace('Utolsó frissítés: 2026.07.14.', 'Utolsó frissítés: 2026.08.12.');
          write('cookie.html', cookiePage);

          // 6) Terms: remove blanket browser-only statement, keep it technology-neutral.
          let terms = read('felhasznalasi-feltetelek.html');
          terms = replaceOnce(terms,
            `      A weboldalon található kalkulátorok tájékoztató jellegű számításokat\n      végeznek. A számítások a böngészőben futnak, a mezőkbe írt értékeket\n      az oldal nem tekinti beküldött adatnak vagy hivatalos ajánlatkérésnek.`,
            `      A weboldalon található kalkulátorok tájékoztató jellegű számításokat\n      végeznek. A számítás a funkciótól függően a böngészőben vagy a Kalkulátor\n      Bázis kapcsolódó API-szolgáltatásával történhet. A mezőkbe írt értékeket az\n      oldal nem tekinti hivatalos ajánlatkérésnek; az adatkezelés részleteit az\n      Adatvédelmi tájékoztató ismerteti.`,
            'terms processing description');
          terms = terms.replace('Utolsó frissítés: 2026.06.26.', 'Utolsó frissítés: 2026.08.12.');
          write('felhasznalasi-feltetelek.html', terms);

          // 7) Guardrails: fail the migration if an eager AdSense loader or stale claim remains.
          const htmlFiles = [];
          const collect = (dir) => {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) collect(full);
              else if (entry.isFile() && entry.name.endsWith('.html')) htmlFiles.push(full);
            }
          };
          collect(root);
          const eager = htmlFiles.filter((f) => adsenseTag.test(fs.readFileSync(f, 'utf8')));
          if (eager.length) throw new Error(`Eager AdSense tags remain: ${eager.join(', ')}`);

          const staleClaims = [
            'kizárólag a látogató\\n      böngészőjében kerülnek feldolgozásra',
            'A számítások a böngészőben futnak',
          ];
          for (const phrase of staleClaims) {
            for (const f of htmlFiles) {
              if (fs.readFileSync(f, 'utf8').includes(phrase)) {
                throw new Error(`Stale privacy claim remains in ${f}: ${phrase}`);
              }
            }
          }
          NODE
      - name: Validate JavaScript syntax
        run: |
          node --check js/cookie.js
          node --check js/penzugyi/netto-brutto-shadow.js
      - name: Commit migration results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset .github/workflows/privacy-consent-bulk-fix.yml
          if git diff --cached --quiet; then
            echo "No migration changes produced"
            exit 1
          fi
          git commit -m "Align privacy notices and consent-controlled AdSense"
          git push origin HEAD:fix/privacy-consent-api
