name: Repository security baseline

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "38 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Dependency and repository security
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"

      - name: Check repository secrets and CI policy
        run: node scripts/repository-security-audit.js

      - name: Audit all locked npm dependencies (high/critical)
        run: npm audit --audit-level=high
