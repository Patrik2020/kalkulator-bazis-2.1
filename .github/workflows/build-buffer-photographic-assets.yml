name: Build photographic Facebook image bank (temporary feature branch)

on:
  push:
    branches:
      - feat/facebook-photographic-rebrand-20261101
    paths:
      - .github/workflows/build-buffer-photographic-assets.yml
      - scripts/generate-buffer-photographic-images.mjs

permissions:
  contents: write

concurrency:
  group: build-buffer-photographic-assets
  cancel-in-progress: false

jobs:
  render:
    name: Produce real-photo cards with original KB logo
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/facebook-photographic-rebrand-20261101
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - name: Install fixed image renderer in isolated directory
        run: npm install --prefix /tmp/buffer-social-render --no-package-lock --no-save --no-audit --no-fund --ignore-scripts @resvg/resvg-js@2.6.2
      - name: Download curated free-license photographs and render artwork
        run: node scripts/generate-buffer-photographic-images.mjs
      - name: Verify 28 valid square PNG files
        run: |
          test "$(find assets/social/facebook/photographic -name '*.png' -type f | wc -l)" -eq 28
          node -e 'const fs=require("fs"),p="assets/social/facebook/photographic/";for(const f of fs.readdirSync(p)){if(!f.endsWith(".png"))continue;const b=fs.readFileSync(p+f);if(b.readUInt32BE(16)!==1080 || b.readUInt32BE(20)!==1080)process.exit(1)}'
      - name: Version resulting assets in feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/social/facebook/photographic/*.png
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "assets: 28 real-photo branded Facebook graphics"
          git push origin HEAD:refs/heads/feat/facebook-photographic-rebrand-20261101
