name: AdSense Quality v2

on:
  push:
    branches:
      - adsense-quality-v2
  # Editorial HTML and sitemap updates are not AdSense policy changes.
  # Run the expensive AdSense audit for monetization and template changes only.
  pull_request:
    paths:
      - "scripts/apply-adsense-*.js"
      - "scripts/adsense-*.js"
      - "scripts/apply-construction-manufacturer-first-v2.js"
      - "scripts/apply-average-hub-*.js"
      - "js/adsense*.js"
      - "js/consent*.js"
      - "js/cookie*.js"
      - "css/adsense*.css"
      - "components/adsense*"
      - ".github/workflows/adsense-quality-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    # A generated materialization commit should not repeat the same expensive
    # AdSense transformation/audit pass that already ran for the human change.
    if: github.event_name != 'pull_request' || github.actor != 'github-actions[bot]'
    name: AdSense Quality v2 gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply template fingerprint cleanup
        run: node scripts/apply-adsense-template-fingerprint-v2.js

      - name: Apply page-specific domain methodology
        run: node scripts/apply-adsense-domain-method-copy-v2.js

      - name: Remove legacy YMYL ownership boilerplate
        run: node scripts/apply-adsense-ymyl-trust-v2.js

      - name: Apply primary YMYL source notes
        run: node scripts/apply-adsense-source-notes-v2.js

      - name: Apply current-content moat
        run: node scripts/apply-adsense-current-moat-v2.js

      - name: Apply Phase 2 converter consolidation
        run: node scripts/apply-adsense-phase2-consolidation.js

      - name: Apply Phase 2 Batch 2 average consolidation
        run: node scripts/apply-adsense-phase2-batch2.js

      - name: Apply AdSense runtime policy
        run: node scripts/apply-adsense-eligibility-v2.js

      - name: Apply audit policy normalization
        run: node scripts/apply-adsense-audit-policy-v2.js

      - name: Materialize Phase 2 public catalog
        run: npm run taxonomy:apply

      - name: Generate content-aware sitemap preview
        run: npm run sitemap

      - name: Validate runtime policy
        run: node scripts/adsense-runtime-policy-audit.js

      - name: Validate Phase 2 consolidation
        run: node scripts/adsense-phase2-audit.js

      - name: Validate Phase 2 Batch 2 consolidation
        run: node scripts/adsense-phase2-batch2-audit.js

      - name: Validate sitemap state
        run: node scripts/sitemap-lastmod-v2-audit.js

      - name: Enforce AdSense Quality v2 gate
        run: node scripts/adsense-quality-v2-audit.js --report --gate

      - name: Add report to job summary
        if: always()
        run: test -f docs/adsense-quality-v2-report.md && cat docs/adsense-quality-v2-report.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: adsense-quality-v2-report
          path: docs/adsense-quality-v2-report.md
          if-no-files-found: warn
          retention-days: 30
